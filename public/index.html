<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pocket Money</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1>💰 Pocket Money</h1>
      <a href="setup.html" class="action" id="manage-kids" hidden>Manage Kids</a>
    </header>

    <div class="content">
      <div id="list"></div>
    </div>

    <script src="/identity.js"></script>
    <script>
      async function load() {
        const el = document.getElementById("list");
        try {
          const [identity, kidsRes] = await Promise.all([
            PocketMoneyIdentity.fetchIdentity(),
            fetch("/api/kids"),
          ]);
          if (!kidsRes.ok) throw new Error(`/api/kids returned ${kidsRes.status}`);
          const isAdmin = await PocketMoneyIdentity.isAdmin(identity);
          const kids = await kidsRes.json();
          document.getElementById("manage-kids").hidden = !isAdmin;

          if (!kids.length) {
            el.innerHTML = `
            <div class="empty">
              <div class="icon">🐣</div>
              <p>${isAdmin ? 'No kids yet.<br><a href="setup.html">Add a kid</a> to get started.' : "No kids yet."}</p>
            </div>`;
            return;
          }

          el.innerHTML = kids
            .map((k) => {
              const b = k.balance;
              const cls = b > 0 ? "pos" : b < 0 ? "neg" : "zero";
              const sign = b > 0 ? "+" : "";
              return `
            <a href="account.html?id=${k.id}" class="kid-card" style="border-left-color:${k.color}">
              <span class="avatar">${k.avatar}</span>
              <div class="info">
                <div class="name">${k.name}</div>
                <div class="label">Balance</div>
              </div>
              <span class="balance ${cls}">${sign}${b.toFixed(2)}</span>
            </a>`;
            })
            .join("");
        } catch (error) {
          el.textContent = error.message;
        }
      }

      load();
    </script>
  </body>
</html>
