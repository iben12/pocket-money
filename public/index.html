<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Money</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>💰 Pocket Money</h1>
    <a href="setup.html" class="action">Manage Kids</a>
  </header>

  <div class="content">
    <div id="list"></div>
  </div>

  <script>
    async function load() {
      const res = await fetch('/api/kids');
      const kids = await res.json();
      const el = document.getElementById('list');

      if (!kids.length) {
        el.innerHTML = `
          <div class="empty">
            <div class="icon">🐣</div>
            <p>No kids yet.<br><a href="setup.html">Add a kid</a> to get started.</p>
          </div>`;
        return;
      }

      el.innerHTML = kids.map(k => {
        const b = k.balance;
        const cls = b > 0 ? 'pos' : b < 0 ? 'neg' : 'zero';
        const sign = b > 0 ? '+' : '';
        return `
          <a href="account.html?id=${k.id}" class="kid-card" style="border-left-color:${k.color}">
            <span class="avatar">${k.avatar}</span>
            <div class="info">
              <div class="name">${k.name}</div>
              <div class="label">Balance</div>
            </div>
            <span class="balance ${cls}">${sign}${b.toFixed(2)}</span>
          </a>`;
      }).join('');
    }

    load();
  </script>
</body>
</html>
