<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="style.css?v=3" />
  </head>
  <body>
    <header class="header" id="hdr">
      <a href="/" class="back">←</a>
      <h1 id="hdr-title">Account</h1>
      <button class="action" id="print-btn" onclick="window.print()" title="Print report">🖨 Print</button>
      <button class="action" id="add-transaction" onclick="openModal()" hidden>+ Add</button>
    </header>

    <div class="acct-info" id="acct-info">
      <div class="avatar" id="kid-avatar"></div>
      <div class="name" id="kid-name"></div>
      <div class="bal-label">Balance</div>
      <div class="bal" id="kid-bal"></div>
      <div class="earnings-stats" id="earnings-stats" aria-label="Earnings summary" hidden>
        <div class="earnings-stat">
          <div class="earnings-label">Earned this week</div>
          <div class="earnings-value" id="earned-this-week">0.00</div>
        </div>
        <div class="earnings-stat">
          <div class="earnings-label">Earned last week</div>
          <div class="earnings-value" id="earned-last-week">0.00</div>
        </div>
      </div>
    </div>

    <div class="content">
      <div id="tx-list"></div>
    </div>

    <!-- Print-only one-page report (this week + last week) -->
    <div class="print-report" id="print-report">
      <div class="print-head">
        <div class="print-title" id="print-name"></div>
        <div class="print-sub">Transactions — this week &amp; last week</div>
      </div>
      <div class="print-summary">
        <div class="print-stat">
          <span class="ps-label">Earned this week</span>
          <span class="ps-val" id="print-week"></span>
        </div>
        <div class="print-stat">
          <span class="ps-label">Earned last week</span>
          <span class="ps-val" id="print-last-week"></span>
        </div>
        <div class="print-stat">
          <span class="ps-label">Balance</span>
          <span class="ps-val" id="print-bal"></span>
        </div>
      </div>
      <table class="print-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Memo</th>
            <th class="num">Amount</th>
          </tr>
        </thead>
        <tbody id="print-rows"></tbody>
      </table>
      <div class="print-foot" id="print-foot"></div>
    </div>

    <!-- Add transaction modal -->
    <div class="overlay" id="overlay" onclick="maybeClose(event)">
      <div class="modal">
        <h2>Add Transaction</h2>
        <form id="tx-form" onsubmit="submitTx(event)">
          <div class="fg">
            <label>Category</label>
            <div class="cat-grid">
              <button type="button" class="cat-btn income sel" data-cat="chore">
                <span class="sign">+</span><span>🧹 Chore</span>
              </button>
              <button type="button" class="cat-btn income" data-cat="pocket_money">
                <span class="sign">+</span><span>💵 Pocket Money</span>
              </button>
              <button type="button" class="cat-btn expense" data-cat="purchase">
                <span class="sign">−</span><span>🛍️ Purchase</span>
              </button>
              <button type="button" class="cat-btn expense" data-cat="cash_payout">
                <span class="sign">−</span><span>💸 Cash Payout</span>
              </button>
            </div>
            <input type="hidden" name="category" value="chore" />
          </div>
          <div class="fg">
            <label>Amount</label>
            <input type="number" name="amount" min="0.01" step="0.01" placeholder="0.00" required />
          </div>
          <div class="fg">
            <label>Memo</label>
            <input type="text" name="memo" placeholder="e.g. Cleaned bedroom" />
          </div>
          <div class="fg">
            <label>Date</label>
            <input type="date" name="date" required />
          </div>
          <button type="submit" class="btn">Save</button>
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
        </form>
      </div>
    </div>

    <script src="/identity.js"></script>
    <script>
      const LABELS = {
        chore: "Chore",
        pocket_money: "Pocket Money",
        purchase: "Purchase",
        cash_payout: "Cash Payout",
      };

      document.querySelector(".cat-grid").addEventListener("click", (e) => {
        const btn = e.target.closest(".cat-btn");
        if (!btn) return;
        document.querySelectorAll(".cat-btn").forEach((b) => b.classList.remove("sel"));
        btn.classList.add("sel");
        document.querySelector('[name="category"]').value = btn.dataset.cat;
        if (btn.dataset.cat === "pocket_money") {
          document.querySelector('[name="amount"]').value = "1";
          document.querySelector('[name="memo"]').value = "daily";
        }
      });

      const params = new URLSearchParams(location.search);
      const kidId = params.get("id");
      let isAdmin = false;
      if (!kidId) location.href = "/";

      function formatLocalDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      // "Thu, Nov 27" — weekday + month/day, no year. Parsed as a local date
      // so a YYYY-MM-DD string isn't shifted by the UTC-midnight interpretation.
      function formatReportDate(dateStr) {
        const [year, month, day] = dateStr.split("-").map(Number);
        return new Date(year, month - 1, day).toLocaleDateString(undefined, {
          weekday: "short",
          month: "short",
          day: "numeric",
        });
      }

      function getWeekStart(date) {
        return new Date(
          date.getFullYear(),
          date.getMonth(),
          date.getDate() - ((date.getDay() + 6) % 7),
        );
      }

      function sumEarningsInRange(transactions, start, end) {
        const startDate = formatLocalDate(start);
        const endDate = formatLocalDate(end);
        return transactions.reduce((total, transaction) => {
          const isIncome = transaction.category === "chore" || transaction.category === "pocket_money";
          return isIncome && transaction.date >= startDate && transaction.date < endDate
            ? total + transaction.amount
            : total;
        }, 0);
      }

      document.querySelector('[name="date"]').value = formatLocalDate(new Date());

      async function load() {
        const el = document.getElementById("tx-list");
        const earningsStats = document.getElementById("earnings-stats");
        earningsStats.hidden = true;
        let kids;
        let txs;
        try {
          const [identity, kidsRes, txRes] = await Promise.all([
            PocketMoneyIdentity.fetchIdentity(),
            fetch("/api/kids"),
            fetch(`/api/transactions?kid_id=${kidId}`),
          ]);
          if (!kidsRes.ok) throw new Error(`/api/kids returned ${kidsRes.status}`);
          if (!txRes.ok) throw new Error(`/api/transactions returned ${txRes.status}`);
          isAdmin = await PocketMoneyIdentity.isAdmin(identity);
          kids = await kidsRes.json();
          txs = await txRes.json();
          document.getElementById("add-transaction").hidden = !isAdmin;
        } catch (error) {
          el.textContent = error.message;
          return;
        }

        const kid = kids.find((k) => String(k.id) === String(kidId));
        if (!kid) {
          location.href = "/";
          return;
        }

        document.getElementById("hdr").style.background = kid.color;
        document.getElementById("hdr-title").textContent = kid.name;
        document.getElementById("kid-avatar").textContent = kid.avatar;
        document.getElementById("kid-name").textContent = kid.name;
        document.getElementById("acct-info").style.borderTop = `4px solid ${kid.color}`;

        const b = kid.balance;
        const balEl = document.getElementById("kid-bal");
        balEl.textContent = (b >= 0 ? "+" : "") + b.toFixed(2);
        balEl.className = "bal " + (b > 0 ? "pos" : b < 0 ? "neg" : "zero");

        const thisWeekStart = getWeekStart(new Date());
        const lastWeekStart = new Date(thisWeekStart);
        lastWeekStart.setDate(lastWeekStart.getDate() - 7);
        const nextWeekStart = new Date(thisWeekStart);
        nextWeekStart.setDate(nextWeekStart.getDate() + 7);
        const earnedThisWeek = sumEarningsInRange(txs, thisWeekStart, nextWeekStart);
        const earnedLastWeek = sumEarningsInRange(txs, lastWeekStart, thisWeekStart);
        document.getElementById("earned-this-week").textContent = earnedThisWeek.toFixed(2);
        document.getElementById("earned-last-week").textContent = earnedLastWeek.toFixed(2);

        if (!txs.length) {
          el.innerHTML = `<div class="empty"><div class="icon">📋</div><p>No transactions yet.</p></div>`;
        } else {
          el.innerHTML = txs
            .map((t) => {
              const pos = t.amount >= 0;
              const sign = pos ? "+" : "";
              return `
            <div class="tx-item">
              <div class="tx-info">
                <div class="tx-memo">${escape(t.memo) || "—"}</div>
                <div class="tx-meta">
                  <span class="tx-date">${t.date}</span>
                  <span class="tx-badge badge-${t.category}">${LABELS[t.category]}</span>
                </div>
              </div>
              <span class="tx-amount ${pos ? "pos" : "neg"}">${sign}${t.amount.toFixed(2)}</span>
              ${isAdmin ? `<button class="tx-del" onclick="deleteTx(${t.id})" title="Delete">🗑</button>` : ""}
            </div>`;
            })
            .join("");
        }
        renderPrintReport(kid, b, earnedThisWeek, earnedLastWeek, txs, lastWeekStart, nextWeekStart);
        earningsStats.hidden = false;
      }

      // Builds the print-only report: name, the two earnings figures, balance,
      // and a compact table limited to this week + last week so it fits one page.
      function renderPrintReport(kid, balance, thisWeek, lastWeek, txs, lastWeekStart, nextWeekStart) {
        document.getElementById("print-name").textContent = kid.name;
        document.getElementById("print-week").textContent = thisWeek.toFixed(2);
        document.getElementById("print-last-week").textContent = lastWeek.toFixed(2);
        const balEl = document.getElementById("print-bal");
        balEl.textContent = (balance >= 0 ? "+" : "") + balance.toFixed(2);
        balEl.className = "ps-val " + (balance > 0 ? "pos" : balance < 0 ? "neg" : "");

        const from = formatLocalDate(lastWeekStart);
        const to = formatLocalDate(nextWeekStart);
        const rows = txs.filter((t) => t.date >= from && t.date < to);
        const body = document.getElementById("print-rows");
        if (!rows.length) {
          body.innerHTML = `<tr><td colspan="4" class="print-none">No transactions this week or last week.</td></tr>`;
        } else {
          body.innerHTML = rows
            .map((t) => {
              const pos = t.amount >= 0;
              const sign = pos ? "+" : "";
              return `<tr>
                <td>${formatReportDate(t.date)}</td>
                <td>${LABELS[t.category]}</td>
                <td>${escape(t.memo) || "—"}</td>
                <td class="num ${pos ? "pos" : "neg"}">${sign}${t.amount.toFixed(2)}</td>
              </tr>`;
            })
            .join("");
        }
        document.getElementById("print-foot").textContent =
          "Printed " + formatReportDate(formatLocalDate(new Date()));
      }

      function escape(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function openModal() {
        document.getElementById("overlay").classList.add("open");
      }

      function closeModal() {
        document.getElementById("overlay").classList.remove("open");
      }

      function maybeClose(e) {
        if (e.target.id === "overlay") closeModal();
      }

      async function submitTx(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const res = await fetch("/api/transactions", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            kid_id: Number(kidId),
            category: fd.get("category"),
            amount: parseFloat(fd.get("amount")),
            memo: fd.get("memo") || "",
            date: fd.get("date"),
          }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          alert("Save failed: " + (err.error ?? res.status));
          return;
        }
        closeModal();
        e.target.reset();
        document.querySelectorAll(".cat-btn").forEach((b) => b.classList.remove("sel"));
        document.querySelector('.cat-btn[data-cat="chore"]').classList.add("sel");
        document.querySelector('[name="category"]').value = "chore";
        document.querySelector('[name="date"]').value = formatLocalDate(new Date());
        load();
      }

      async function deleteTx(id) {
        if (!confirm("Delete this transaction?")) return;
        const res = await fetch(`/api/transactions/${id}`, {method: "DELETE"});
        if (!res.ok) {
          alert("Delete failed: " + res.status);
          return;
        }
        load();
      }

      load();
    </script>
  </body>
</html>
