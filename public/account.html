<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="style.css?v=3" />
  </head>
  <body>
    <header class="header" id="hdr">
      <a href="/" class="back">←</a>
      <h1 id="hdr-title">Account</h1>
      <button class="action" id="print-btn" onclick="printReport()" title="Print report">🖨 Print</button>
      <button class="action" id="add-transaction" onclick="openModal()" hidden>+ Add</button>
    </header>

    <div class="acct-info" id="acct-info">
      <div class="avatar" id="kid-avatar"></div>
      <div class="name" id="kid-name"></div>
      <div class="bal-label">Balance</div>
      <div class="bal" id="kid-bal"></div>
      <div class="earnings-stats" id="earnings-stats" aria-label="Earnings summary" hidden>
        <div class="earnings-stat">
          <div class="earnings-label">Earned this week</div>
          <div class="earnings-value" id="earned-this-week">0.00</div>
        </div>
        <div class="earnings-stat">
          <div class="earnings-label">Earned last week</div>
          <div class="earnings-value" id="earned-last-week">0.00</div>
        </div>
      </div>
    </div>

    <div class="content">
      <div id="tx-list"></div>
    </div>

    <!-- Print-only one-page report (this week + last week) -->
    <div class="print-report" id="print-report">
      <div class="print-head">
        <div class="print-title" id="print-name"></div>
        <div class="print-sub">Recent transactions</div>
      </div>
      <div class="print-summary">
        <div class="print-stat">
          <span class="ps-label">Earned this week</span>
          <span class="ps-val" id="print-week"></span>
        </div>
        <div class="print-stat">
          <span class="ps-label">Earned last week</span>
          <span class="ps-val" id="print-last-week"></span>
        </div>
        <div class="print-stat">
          <span class="ps-label">Balance</span>
          <span class="ps-val" id="print-bal"></span>
        </div>
      </div>
      <table class="print-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Memo</th>
            <th class="num">Amount</th>
          </tr>
        </thead>
        <tbody id="print-rows"></tbody>
      </table>
      <div class="print-foot" id="print-foot"></div>
    </div>

    <!-- Add transaction modal -->
    <div class="overlay" id="overlay" onclick="maybeClose(event)">
      <div class="modal">
        <h2>Add Transaction</h2>
        <form id="tx-form" onsubmit="submitTx(event)">
          <div class="fg">
            <label>Category</label>
            <div class="cat-grid">
              <button type="button" class="cat-btn income sel" data-cat="chore">
                <span class="sign">+</span><span>🧹 Chore</span>
              </button>
              <button type="button" class="cat-btn income" data-cat="pocket_money">
                <span class="sign">+</span><span>💵 Pocket Money</span>
              </button>
              <button type="button" class="cat-btn expense" data-cat="purchase">
                <span class="sign">−</span><span>🛍️ Purchase</span>
              </button>
              <button type="button" class="cat-btn expense" data-cat="cash_payout">
                <span class="sign">−</span><span>💸 Cash Payout</span>
              </button>
            </div>
            <input type="hidden" name="category" value="chore" />
          </div>
          <div class="fg">
            <label>Amount</label>
            <input type="number" name="amount" min="0.01" step="0.01" placeholder="0.00" required />
          </div>
          <div class="fg">
            <label>Memo</label>
            <input type="text" name="memo" placeholder="e.g. Cleaned bedroom" />
          </div>
          <div class="fg">
            <label>Date</label>
            <input type="date" name="date" required />
          </div>
          <button type="submit" class="btn">Save</button>
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
        </form>
      </div>
    </div>

    <script src="/identity.js"></script>
    <script src="/vendor/jspdf.umd.min.js"></script>
    <script>
      const LABELS = {
        chore: "Chore",
        pocket_money: "Pocket Money",
        purchase: "Purchase",
        cash_payout: "Cash Payout",
      };

      document.querySelector(".cat-grid").addEventListener("click", (e) => {
        const btn = e.target.closest(".cat-btn");
        if (!btn) return;
        document.querySelectorAll(".cat-btn").forEach((b) => b.classList.remove("sel"));
        btn.classList.add("sel");
        document.querySelector('[name="category"]').value = btn.dataset.cat;
        if (btn.dataset.cat === "pocket_money") {
          document.querySelector('[name="amount"]').value = "1";
        }
      });

      const params = new URLSearchParams(location.search);
      const kidId = params.get("id");
      let isAdmin = false;
      let reportData = null;
      if (!kidId) location.href = "/";

      function formatLocalDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      // "Thu, Nov 27" — weekday + month/day, no year. Parsed as a local date
      // so a YYYY-MM-DD string isn't shifted by the UTC-midnight interpretation.
      function formatReportDate(dateStr) {
        const [year, month, day] = dateStr.split("-").map(Number);
        return new Date(year, month - 1, day).toLocaleDateString(undefined, {
          weekday: "short",
          month: "short",
          day: "numeric",
        });
      }

      function getWeekStart(date) {
        return new Date(
          date.getFullYear(),
          date.getMonth(),
          date.getDate() - ((date.getDay() + 6) % 7),
        );
      }

      function sumEarningsInRange(transactions, start, end) {
        const startDate = formatLocalDate(start);
        const endDate = formatLocalDate(end);
        return transactions.reduce((total, transaction) => {
          const isIncome = transaction.category === "chore" || transaction.category === "pocket_money";
          return isIncome && transaction.date >= startDate && transaction.date < endDate
            ? total + transaction.amount
            : total;
        }, 0);
      }

      document.querySelector('[name="date"]').value = formatLocalDate(new Date());

      async function load() {
        const el = document.getElementById("tx-list");
        const earningsStats = document.getElementById("earnings-stats");
        earningsStats.hidden = true;
        let kids;
        let txs;
        try {
          const [identity, kidsRes, txRes] = await Promise.all([
            PocketMoneyIdentity.fetchIdentity(),
            fetch("/api/kids"),
            fetch(`/api/transactions?kid_id=${kidId}`),
          ]);
          if (!kidsRes.ok) throw new Error(`/api/kids returned ${kidsRes.status}`);
          if (!txRes.ok) throw new Error(`/api/transactions returned ${txRes.status}`);
          isAdmin = await PocketMoneyIdentity.isAdmin(identity);
          kids = await kidsRes.json();
          txs = await txRes.json();
          document.getElementById("add-transaction").hidden = !isAdmin;
        } catch (error) {
          el.textContent = error.message;
          return;
        }

        const kid = kids.find((k) => String(k.id) === String(kidId));
        if (!kid) {
          location.href = "/";
          return;
        }

        document.getElementById("hdr").style.background = kid.color;
        document.getElementById("hdr-title").textContent = kid.name;
        document.getElementById("kid-avatar").textContent = kid.avatar;
        document.getElementById("kid-name").textContent = kid.name;
        document.getElementById("acct-info").style.borderTop = `4px solid ${kid.color}`;

        const b = kid.balance;
        const balEl = document.getElementById("kid-bal");
        balEl.textContent = (b >= 0 ? "+" : "") + b.toFixed(2);
        balEl.className = "bal " + (b > 0 ? "pos" : b < 0 ? "neg" : "zero");

        const thisWeekStart = getWeekStart(new Date());
        const lastWeekStart = new Date(thisWeekStart);
        lastWeekStart.setDate(lastWeekStart.getDate() - 7);
        const nextWeekStart = new Date(thisWeekStart);
        nextWeekStart.setDate(nextWeekStart.getDate() + 7);
        const earnedThisWeek = sumEarningsInRange(txs, thisWeekStart, nextWeekStart);
        const earnedLastWeek = sumEarningsInRange(txs, lastWeekStart, thisWeekStart);
        document.getElementById("earned-this-week").textContent = earnedThisWeek.toFixed(2);
        document.getElementById("earned-last-week").textContent = earnedLastWeek.toFixed(2);

        if (!txs.length) {
          el.innerHTML = `<div class="empty"><div class="icon">📋</div><p>No transactions yet.</p></div>`;
        } else {
          el.innerHTML = txs
            .map((t) => {
              const pos = t.amount >= 0;
              const sign = pos ? "+" : "";
              return `
            <div class="tx-item">
              <div class="tx-info">
                <div class="tx-memo">${escape(t.memo) || "—"}</div>
                <div class="tx-meta">
                  <span class="tx-date">${t.date}</span>
                  <span class="tx-badge badge-${t.category}">${LABELS[t.category]}</span>
                </div>
              </div>
              <span class="tx-amount ${pos ? "pos" : "neg"}">${sign}${t.amount.toFixed(2)}</span>
              ${isAdmin ? `<button class="tx-del" onclick="deleteTx(${t.id})" title="Delete">🗑</button>` : ""}
            </div>`;
            })
            .join("");
        }
        renderPrintReport(kid, b, earnedThisWeek, earnedLastWeek, txs);
        earningsStats.hidden = false;
      }

      // Builds the print-only report: name, the two earnings figures, balance,
      // and a compact table of the most recent transactions so it fits one page.
      // Also stashes the same data in `reportData` for the canvas/share path.
      const PRINT_MAX_ROWS = 25;

      function renderPrintReport(kid, balance, thisWeek, lastWeek, txs) {
        const rows = txs.slice(0, PRINT_MAX_ROWS).map((t) => {
          const pos = t.amount >= 0;
          return {
            date: formatReportDate(t.date),
            category: LABELS[t.category],
            memo: t.memo || "—",
            amount: (pos ? "+" : "") + t.amount.toFixed(2),
            pos,
          };
        });
        reportData = {
          name: kid.name,
          avatar: kid.avatar || "",
          thisWeek: thisWeek.toFixed(2),
          lastWeek: lastWeek.toFixed(2),
          balance: (balance >= 0 ? "+" : "") + balance.toFixed(2),
          balanceSign: balance > 0 ? "pos" : balance < 0 ? "neg" : "",
          rows,
          printed: "Printed " + formatReportDate(formatLocalDate(new Date())),
        };

        document.getElementById("print-name").textContent =
          (reportData.avatar ? reportData.avatar + " " : "") + reportData.name;
        document.getElementById("print-week").textContent = reportData.thisWeek;
        document.getElementById("print-last-week").textContent = reportData.lastWeek;
        const balEl = document.getElementById("print-bal");
        balEl.textContent = reportData.balance;
        balEl.className = "ps-val " + reportData.balanceSign;

        const body = document.getElementById("print-rows");
        if (!rows.length) {
          body.innerHTML = `<tr><td colspan="4" class="print-none">No transactions yet.</td></tr>`;
        } else {
          body.innerHTML = rows
            .map(
              (r) => `<tr>
                <td>${escape(r.date)}</td>
                <td>${escape(r.category)}</td>
                <td>${escape(r.memo)}</td>
                <td class="num ${r.pos ? "pos" : "neg"}">${escape(r.amount)}</td>
              </tr>`,
            )
            .join("");
        }
        document.getElementById("print-foot").textContent = reportData.printed;
      }

      // iOS home-screen web apps can't reach Share → Print and window.print()
      // is a no-op there, so render the report to a PDF and hand it to the
      // native share sheet (Print / Save to Files). Everywhere else, use
      // window.print() with the @media print layout directly.
      // The file is built synchronously so navigator.share() stays within the
      // click's user-activation window (iOS rejects it otherwise).
      function printReport() {
        if (!reportData) return;
        const isIosStandalone = navigator.standalone === true;
        if (!isIosStandalone || typeof navigator.canShare !== "function") {
          window.print();
          return;
        }
        let file;
        try {
          file = buildReportPdfFile();
        } catch (err) {
          console.error("Could not build report PDF", err);
          window.print();
          return;
        }
        if (file && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: `${reportData.name} — pocket money` }).catch((err) => {
            if (err && err.name === "AbortError") return; // user dismissed the sheet
            console.error("Share failed", err);
          });
          return;
        }
        window.print();
      }

      // Wraps the canvas report in a one-page PDF. A PDF (vs a bare image) makes
      // iOS print it as a document — normal quality — instead of photo/best. The
      // canvas keeps full Unicode (ő/ű, emoji) that jsPDF's built-in fonts lack.
      function buildReportPdfFile() {
        const { jsPDF } = window.jspdf;
        const canvas = drawReportCanvas();
        const imgData = canvas.toDataURL("image/png");
        const doc = new jsPDF({ unit: "pt", format: "a4" });
        const M = 28;
        const maxW = doc.internal.pageSize.getWidth() - 2 * M;
        const maxH = doc.internal.pageSize.getHeight() - 2 * M;
        const ratio = canvas.height / canvas.width;
        let w = maxW;
        let h = w * ratio;
        if (h > maxH) {
          h = maxH;
          w = h / ratio;
        }
        doc.addImage(imgData, "PNG", M, M, w, h, undefined, "FAST");
        const safeName = reportData.name.replace(/[^\w.-]+/g, "_") || "kid";
        return new File([doc.output("blob")], `${safeName}-pocket-money.pdf`, {
          type: "application/pdf",
        });
      }

      function truncate(ctx, text, maxWidth) {
        if (ctx.measureText(text).width <= maxWidth) return text;
        let t = text;
        while (t.length > 1 && ctx.measureText(t + "…").width > maxWidth) {
          t = t.slice(0, -1);
        }
        return t + "…";
      }

      // Draws the one-page report onto a canvas (supersampled for crisp output),
      // mirroring the @media print layout. Used as the PDF's page image.
      function drawReportCanvas() {
        const S = 3; // supersample
        const W = 620;
        const M = 28;
        const rowH = 26;
        const rows = reportData.rows;
        const bodyRows = rows.length || 1;
        const H = 254 + bodyRows * rowH;

        const canvas = document.createElement("canvas");
        canvas.width = W * S;
        canvas.height = H * S;
        const ctx = canvas.getContext("2d");
        ctx.scale(S, S);
        const sans = "-apple-system, system-ui, 'Segoe UI', sans-serif";

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, W, H);

        let y = M + 26;
        // Title (avatar + name) + subtitle
        ctx.fillStyle = "#000000";
        let nameX = M;
        if (reportData.avatar) {
          ctx.font = `24px ${sans}`;
          ctx.fillText(reportData.avatar, M, y);
          nameX = M + ctx.measureText(reportData.avatar).width + 10;
        }
        ctx.font = `800 26px ${sans}`;
        ctx.fillText(reportData.name, nameX, y);
        ctx.font = `500 12px ${sans}`;
        ctx.fillStyle = "#444444";
        ctx.textAlign = "right";
        ctx.fillText("Recent transactions", W - M, y);
        ctx.textAlign = "left";
        y += 14;
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(M, y);
        ctx.lineTo(W - M, y);
        ctx.stroke();
        y += 30;

        // Summary stats
        const stats = [
          { label: "EARNED THIS WEEK", value: reportData.thisWeek, color: "#047857" },
          { label: "EARNED LAST WEEK", value: reportData.lastWeek, color: "#047857" },
          {
            label: "BALANCE",
            value: reportData.balance,
            color: reportData.balanceSign === "neg" ? "#b91c1c" : reportData.balanceSign === "pos" ? "#047857" : "#000000",
          },
        ];
        const colW = (W - 2 * M) / 3;
        stats.forEach((s, i) => {
          const x = M + i * colW;
          ctx.font = `600 10px ${sans}`;
          ctx.fillStyle = "#555555";
          ctx.fillText(s.label, x, y);
          ctx.font = `700 20px ${sans}`;
          ctx.fillStyle = s.color;
          ctx.fillText(s.value, x, y + 24);
        });
        y += 54;

        // Table
        const xDate = M;
        const xCat = M + 110;
        const xMemo = M + 230;
        const xAmt = W - M;
        const memoMax = xAmt - 70 - xMemo;

        ctx.font = `700 10px ${sans}`;
        ctx.fillStyle = "#555555";
        ctx.fillText("DATE", xDate, y);
        ctx.fillText("CATEGORY", xCat, y);
        ctx.fillText("MEMO", xMemo, y);
        ctx.textAlign = "right";
        ctx.fillText("AMOUNT", xAmt, y);
        ctx.textAlign = "left";
        y += 8;
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(M, y);
        ctx.lineTo(W - M, y);
        ctx.stroke();
        y += rowH - 8;

        if (!rows.length) {
          ctx.font = `400 13px ${sans}`;
          ctx.fillStyle = "#777777";
          ctx.textAlign = "center";
          ctx.fillText("No transactions yet.", W / 2, y);
          ctx.textAlign = "left";
        } else {
          rows.forEach((r) => {
            ctx.font = `400 13px ${sans}`;
            ctx.fillStyle = "#111111";
            ctx.fillText(r.date, xDate, y);
            ctx.fillText(r.category, xCat, y);
            ctx.fillText(truncate(ctx, r.memo, memoMax), xMemo, y);
            ctx.font = `600 13px ${sans}`;
            ctx.fillStyle = r.pos ? "#047857" : "#b91c1c";
            ctx.textAlign = "right";
            ctx.fillText(r.amount, xAmt, y);
            ctx.textAlign = "left";
            ctx.strokeStyle = "#dddddd";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(M, y + 8);
            ctx.lineTo(W - M, y + 8);
            ctx.stroke();
            y += rowH;
          });
        }

        y += 16;
        ctx.font = `400 10px ${sans}`;
        ctx.fillStyle = "#888888";
        ctx.fillText(reportData.printed, M, y);

        return canvas;
      }

      function escape(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function openModal() {
        document.getElementById("overlay").classList.add("open");
      }

      function closeModal() {
        document.getElementById("overlay").classList.remove("open");
      }

      function maybeClose(e) {
        if (e.target.id === "overlay") closeModal();
      }

      async function submitTx(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const res = await fetch("/api/transactions", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            kid_id: Number(kidId),
            category: fd.get("category"),
            amount: parseFloat(fd.get("amount")),
            memo: fd.get("memo") || "",
            date: fd.get("date"),
          }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          alert("Save failed: " + (err.error ?? res.status));
          return;
        }
        closeModal();
        e.target.reset();
        document.querySelectorAll(".cat-btn").forEach((b) => b.classList.remove("sel"));
        document.querySelector('.cat-btn[data-cat="chore"]').classList.add("sel");
        document.querySelector('[name="category"]').value = "chore";
        document.querySelector('[name="date"]').value = formatLocalDate(new Date());
        load();
      }

      async function deleteTx(id) {
        if (!confirm("Delete this transaction?")) return;
        const res = await fetch(`/api/transactions/${id}`, {method: "DELETE"});
        if (!res.ok) {
          alert("Delete failed: " + res.status);
          return;
        }
        load();
      }

      load();
    </script>
  </body>
</html>
